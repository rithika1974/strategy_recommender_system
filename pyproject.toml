[project]
name = "strategy-recommender"
version = "0.1.0"
description = "Indian stock strategy recommendation and research system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2.3",
  "numpy>=2.1.0",
  "pyarrow>=17.0.0",
  "PyYAML>=6.0.2",
  "pydantic>=2.7.4",
  "pytest>=8.3.2",
  "requests>=2.32.3",
  "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

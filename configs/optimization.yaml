optimization:
  objective:
    sharpe_weight: 1.0
    return_weight: 0.5
    drawdown_weight: 1.0
  top_train_candidates: 3
  minimum_trade_count_warning: 20
  output_path: "data/strategy/performance/optimization_results.json"
  parameter_grids:
    momentum:
      threshold: [0.03, 0.05, 0.08]
    trend_following:
      crossover_threshold: [0.0, 0.01, 0.02]
      require_regime_confirmation: [true, false]
    mean_reversion:
      oversold_rsi: [25, 30]
      overbought_rsi: [70, 75]
      lower_percent_b: [-0.1, 0.0]
      upper_percent_b: [1.0, 1.1]
    breakout:
      breakout_multiplier: [1.0, 1.5, 2.0]

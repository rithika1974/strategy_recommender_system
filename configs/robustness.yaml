robustness:
  test_cutoff: "2026-01-01"
  expected_stock_count: 30
  output_path: "data/strategy/performance/robustness_results.json"
  temporal_folds:
    - name: "fold_1"
      context_start_date: "2020-01-01"
      context_end_date: "2022-12-31"
      evaluation_start_date: "2023-01-01"
      evaluation_end_date: "2023-12-31"
    - name: "fold_2"
      context_start_date: "2020-01-01"
      context_end_date: "2023-12-31"
      evaluation_start_date: "2024-01-01"
      evaluation_end_date: "2024-12-31"
    - name: "fold_3"
      context_start_date: "2020-01-01"
      context_end_date: "2024-12-31"
      evaluation_start_date: "2025-01-01"
      evaluation_end_date: "2025-12-31"
  analysis_period:
    start_date: "2020-01-01"
    end_date: "2025-12-31"
  sensitivity:
    minimum_neighbors: 1
    minimum_validation_trades: 20
    maximum_objective_difference: 0.50
    maximum_return_difference: 0.10
    material_return_reversal: 0.05
    boundary_minimum_grid_values: 3
  regime:
    minimum_observations: 20
    minimum_trades: 10
    market_values: ["BULL", "BEAR"]
    volatility_values: ["LOW", "HIGH"]
  hypothesis:
    regime_sharpe_spread: 0.25
    stock_concentration_top_fraction: 0.20
    stock_concentration_threshold: 0.60
